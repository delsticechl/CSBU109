<!DOCTYPE html>
<html>
<head>
  <title>My First Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background-color: #fce4ec; 
      color: #333;
      text-align: center;
      padding: 50px;
      margin: 0;
    }
    h1 {
      color: #ff4081;
      background-color: #fff;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      display: inline-block;
      font-size: 2.5em;
    }
    p {
      font-size: 18px;
      margin-top: 20px;
      background-color: #fff3e0;
      padding: 15px;
      border-radius: 10px;
      display: inline-block;
      max-width: 90%;
    }

    @media (max-width: 600px) {
      body {
        padding: 20px;
      }
      h1 {
        font-size: 1.8em;
        padding: 15px;
      }
      p {
        font-size: 16px;
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <h1> Hello, World! </h1>
  <p>This is my first static web page.</p>
</body>
</html>
